<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real AI — No Puter — No Login</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column}
header{padding:12px 16px;background:#111;border-bottom:1px solid #222;display:flex;justify-content:space-between}
#chat{flex:1;padding:20px;max-width:900px;width:100%;margin:0 auto;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.msg{padding:14px 16px;border-radius:16px;line-height:1.7;white-space:pre-wrap;word-break:break-word;max-width:92%;font-size:15px}
.u{background:#2563eb;align-self:flex-end}
.a{background:#18181b;border:1px solid #27272a;align-self:flex-start}
#bar{position:sticky;bottom:0;padding:12px;background:#0a0a0a;border-top:1px solid #222;display:flex;gap:8px;max-width:900px;width:100%;margin:0 auto}
input{flex:1;padding:14px 16px;border-radius:24px;border:1px solid #333;background:#18181b;color:#fff;outline:none}
button{padding:12px 20px;border-radius:24px;background:#fff;color:#000;border:none;font-weight:700;cursor:pointer}
iframe{width:100%;height:420px;border-radius:12px;border:1px solid #333;margin-top:10px;background:#fff}
img{max-width:100%;border-radius:12px;margin-top:10px;border:1px solid #222}
</style>
</head>
<body>
<header><b>🤖 Real AI — No Puter, No Login</b><small style="color:#22c55e">● GPT-4o</small></header>
<div id="chat"><div class="msg a">Live ✅ No Puter, No Login. Real GPT-4o via Hack Club. Try "gist me", "build portfolio", "generate image of Lagos"</div></div>
<div id="bar"><input id="q" placeholder="Ask anything..."><button onclick="send()">Send</button></div>
<script>
const chatEl=document.getElementById('chat');const qEl=document.getElementById('q');let history=[];
function add(r,t){const d=document.createElement('div');d.className='msg '+(r==='user'?'u':'a');if(r==='assistant'&&t.includes('```html')){const m=t.match(/```html([\s\S]*?)```/);if(m){d.textContent=t.split('```html')[0];const f=document.createElement('iframe');f.srcdoc=m[1];d.appendChild(f);const b=document.createElement('button');b.textContent='⬇ Download';b.style.cssText='margin-top:8px;padding:8px 12px;border-radius:8px;background:#2563eb;color:#fff;border:none;cursor:pointer';b.onclick=()=>{const blob=new Blob([m[1]],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='website.html';a.click();};d.appendChild(document.createElement('br'));d.appendChild(b);}else d.textContent=t;}else{d.textContent=t;if(r==='assistant'&&t.includes('[IMAGE:')){const mm=t.match(/\[IMAGE:\s*(.*?)\]/);if(mm){const img=document.createElement('img');img.src='https://image.pollinations.ai/prompt/'+encodeURIComponent(mm[1])+'?width=1024&height=1024&nologo=true&seed='+Math.floor(Math.random()*1000000);d.appendChild(img);}}}chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;return d;}
async function chatAI(p){const res=await fetch('https://ai.hackclub.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai/gpt-4o-mini',messages:[...history,{role:'user',content:p}],stream:false})});if(!res.ok)throw new Error('AI '+res.status);const data=await res.json();return data.choices?.[0]?.message?.content||'';}
async function send(){const t=qEl.value.trim();if(!t)return;qEl.value='';add('user',t);const b=add('assistant','Thinking...');try{let a=await chatAI(t);b.textContent='';b.textContent=a;if(a.includes('```html')){const m=a.match(/```html([\s\S]*?)```/);if(m){b.textContent=a.split('```html')[0];const f=document.createElement('iframe');f.srcdoc=m[1];b.appendChild(f);}}if(a.includes('[IMAGE:')){const mm=a.match(/\[IMAGE:\s*(.*?)\]/);if(mm){const img=document.createElement('img');img.src='https://image.pollinations.ai/prompt/'+encodeURIComponent(mm[1])+'?width=1024&height=1024&nologo=true&seed='+Math.floor(Math.random()*1000000);b.appendChild(img);}}history.push({role:'user',content:t},{role:'assistant',content:a});}catch(e){b.textContent='Error: '+e.message;}}
qEl.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script>
</body>
</html>
