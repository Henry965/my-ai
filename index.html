<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real AI</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column}header{padding:12px 16px;background:#111;border-bottom:1px solid #222}#chat{flex:1;padding:20px;max-width:900px;margin:0 auto;width:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}.msg{padding:14px 16px;border-radius:16px;white-space:pre-wrap;max-width:92%}.u{background:#2563eb;align-self:flex-end}.a{background:#18181b;border:1px solid #27272a;align-self:flex-start}#bar{position:sticky;bottom:0;padding:12px;background:#0a0a0a;border-top:1px solid #222;display:flex;gap:8px;max-width:900px;margin:0 auto;width:100%}input{flex:1;padding:14px 16px;border-radius:24px;border:1px solid #333;background:#18181b;color:#fff;outline:none}button{padding:12px 20px;border-radius:24px;background:#fff;color:#000;border:none;font-weight:700;cursor:pointer}</style>
</head>
<body>
<header><b>🤖 Real AI - Final</b></header>
<div id="chat"><div class="msg a">Live - bypasses block. Try "gist me"</div></div>
<div id="bar"><input id="q" placeholder="Ask..."><button onclick="send()">Send</button></div>
<script>
const chatEl=document.getElementById('chat');const qEl=document.getElementById('q');
function add(r,t){const d=document.createElement('div');d.className='msg '+(r==='user'?'u':'a');d.textContent=t;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;return d;}
async function tryFetch(url){const ps=[u=>u,u=>'https://corsproxy.io/?'+encodeURIComponent(u),u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u)];for(const p of ps){try{const r=await fetch(p(url));if(r.ok)return r;}catch{}}throw new Error('blocked');}
async function send(){const t=qEl.value.trim();if(!t)return;qEl.value='';add('user',t);const b=add('assistant','Thinking...');try{const url='https://text.pollinations.ai/'+encodeURIComponent(t)+'?model=openai&seed='+Math.floor(Math.random()*1000000);const r=await tryFetch(url);const a=await r.text();b.textContent=a;}catch(e){b.textContent='Render still blocking. Use Netlify Drop: https://app.netlify.com/drop drag this file - works 100%. '+e.message;}}
qEl.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script>
</body>
</html>
