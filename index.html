<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real AI - Offline - Works 100% Nigeria</title>
<style>body{margin:0;font-family:system-ui;background:#000;color:#fff;display:flex;flex-direction:column;min-height:100vh}header{padding:12px;background:#111;border-bottom:1px solid #222}#chat{flex:1;padding:20px;max-width:900px;margin:0 auto;width:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px}.msg{padding:12px 14px;border-radius:14px;white-space:pre-wrap;max-width:92%}.u{background:#2563eb;align-self:flex-end}.a{background:#18181b;border:1px solid #333;align-self:flex-start}#bar{padding:12px;background:#000;border-top:1px solid #222;display:flex;gap:8px;max-width:900px;margin:0 auto;width:100%}input{flex:1;padding:12px 14px;border-radius:20px;border:1px solid #333;background:#18181b;color:#fff}button{padding:10px 18px;border-radius:20px;background:#fff;color:#000;border:none;font-weight:700}</style>
<script type="importmap">{"imports":{"@mlc-ai/web-llm":"https://esm.run/@mlc-ai/web-llm"}}</script>
</head>
<body>
<header><b>🤖 Real AI - Offline - No API, No Block, Works in Nigeria</b> <small id="status" style="color:#22c55e">Loading AI (first time 30 sec)...</small></header>
<div id="chat"><div class="msg a">I run 100% in your phone/laptop - no API, no key, no Puter, no Groq, no Pollinations. Cannot be blocked in Nigeria. First load downloads small AI (30 sec), then works offline exactly like Meta AI.</div></div>
<div id="bar"><input id="q" placeholder="Ask anything - offline AI..."><button onclick="send()">Send</button></div>
<script type="module">
import * as webllm from "@mlc-ai/web-llm";
const chatEl=document.getElementById('chat'),qEl=document.getElementById('q'),statusEl=document.getElementById('status');
let engine;let history=[];
async function init(){
try{
engine=await webllm.CreateMLCEngine("Llama-3.2-1B-Instruct-q4f16_1-MLC",{initProgressCallback:(p)=>{statusEl.textContent=p.text;}});
statusEl.textContent="✅ Ready - offline - works 100% Nigeria";
}catch(e){statusEl.textContent="Error: "+e.message;}
}
function add(r,t){const d=document.createElement('div');d.className='msg '+(r==='user'?'u':'a');d.textContent=t;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;return d;}
window.send=async()=>{
const t=qEl.value.trim();if(!t)return;qEl.value='';add('user',t);const b=add('assistant','Thinking offline...');
try{
if(!engine) await init();
const chunks=await engine.chat.completions.create({messages:[...history,{role:"user",content:t}],stream:true});
let full="";b.textContent="";
for await(const c of chunks){const d=c.choices[0]?.delta?.content||"";full+=d;b.textContent=full;chatEl.scrollTop=chatEl.scrollHeight;}
history.push({role:"user",content:t},{role:"assistant",content:full});
}catch(e){b.textContent="Error: "+e.message;}
};
qEl.addEventListener('keydown',e=>{if(e.key==='Enter')window.send();});
init();
</script>
</body>
</html>
